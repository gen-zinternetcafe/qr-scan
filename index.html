<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Scan</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Roboto+Flex:ital,wght@1,300&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #555;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        #adminPanel {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop autoplay muted>
        <source src="Backgroundmusic.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        bgMusic.play().catch(() => console.log('Autoplay blocked'));

        document.addEventListener('click', () => {
            bgMusic.muted = false;
            bgMusic.play();
        }, { once: true });
    </script>

    <!-- Logo -->
    <div class="logo-container"></div>

    <!-- Message -->
    <h2 id="message">Checking QR Code...</h2>

    <!-- Firebase Configuration & QR Scan Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAfNFpDjhB1y4-wOpU6V7vHEw2HKOlSNKw",
            authDomain: "genz-qr.firebaseapp.com",
            projectId: "genz-qr",
            storageBucket: "genz-qr.firebasestorage.app",
            messagingSenderId: "44439219231",
            appId: "1:44439219231:web:bc89320fe9492a02b9b92a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const qrRef = db.collection("qr").doc("genz");

        const facebookLink = "https://www.facebook.com/GenZInternetCafe";
        const maxAttempts = 2;

        let deviceId = localStorage.getItem("deviceId");
        if (!deviceId) {
            deviceId = 'device-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            localStorage.setItem("deviceId", deviceId);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                qrRef.get().then(doc => {
                    if (!doc.exists) {
                        qrRef.set({ devices: {} });
                        document.getElementById("message").innerText =
                            "Initializing QR system, please scan again.";
                        return;
                    }

                    const devices = doc.data().devices || {};
                    const deviceAttempts = devices[deviceId] || 0;

                    if (deviceAttempts >= maxAttempts) {
                        document.getElementById("message").innerText =
                            "❌ QR Code blocked! Maximum attempts reached for this device.";
                    } else {
                        devices[deviceId] = deviceAttempts + 1;

                        qrRef.update({ devices }).then(() => {
                            const attemptsLeft = maxAttempts - devices[deviceId];
                            document.getElementById("message").innerText =
                                `✅ QR Code valid! Redirecting...`;

                            setTimeout(() => {
                                window.location.href = facebookLink;
                            }, 2000);
                        });
                    }
                });
            }, 800);
        });
    </script>

    <!-- ================= ADMIN PANEL ================= -->

    <hr>

    <h3 onclick="toggleAdmin()" style="cursor:pointer;">🔒 Admin Panel</h3>

    <div id="adminPanel" style="display:none;">
        <input type="password" id="adminPass" placeholder="Admin password">
        <button onclick="loadAdmin()">Enter</button>

        <h3>📋 Facebook Scan List</h3>
        <ul id="fbList"></ul>
    </div>

    <script>
        const ADMIN_PASSWORD = "010884"; // 🔴 CHANGE THIS

        function toggleAdmin() {
            document.getElementById("adminPanel").style.display = "block";
        }

        function loadAdmin() {
            const pass = document.getElementById("adminPass").value;

            if (pass !== ADMIN_PASSWORD) {
                alert("Wrong admin password");
                return;
            }

            const list = document.getElementById("fbList");
            list.innerHTML = "";

            db.collection("facebook_users")
              .orderBy("scannedAt", "desc")
              .onSnapshot(snapshot => {
                  list.innerHTML = "";
                  snapshot.forEach(doc => {
                      const d = doc.data();
                      const li = document.createElement("li");

                      const date = d.scannedAt
                        ? d.scannedAt.toDate().toLocaleString()
                        : "";

                      li.textContent = `${d.facebookName || "Unknown"} — ${date}`;
                      list.appendChild(li);
                  });
              });
        }
    </script>

    <!-- Footer -->
    <footer id="footer">© 2026 Gen - Z Internet Cafe. All Rights Reserved.</footer>

    <script>
        const footer = document.getElementById('footer');
        const messages = [
            "© 2026 Gen - Z Internet Cafe. All Rights Reserved.",
            `<span style="font-family: 'Montserrat', sans-serif; font-weight: 800;">Call Us :</span>
             <span style="font-family: 'Roboto Flex', sans-serif; font-style: italic;">+907-014-2659 |</span>
             <span style="font-family: 'Montserrat', sans-serif; font-weight: 800;"> ZIP :</span>
             <span style="font-family: 'Roboto Flex', sans-serif; font-style: italic;">6128</span><br>
             <span style="font-family: 'Montserrat', sans-serif; font-weight: 800;">Address :</span>
             <span style="font-family: 'Roboto Flex', sans-serif; font-style: italic;">
             Rizal st. cor. Millan st. 2nd flr. Max Fuel Gasoline Station Bldg. Isabela Neg. Occ.
             </span>`
        ];
        let current = 0;

        function loopFooter() {
            footer.style.opacity = 0;
            setTimeout(() => {
                current = (current + 1) % messages.length;
                footer.innerHTML = messages[current];
                footer.style.opacity = 1;
            }, 1000);
        }

        setTimeout(() => footer.style.opacity = 1, 500);
        setInterval(loopFooter, 5000);
    </script>

</body>
</html>
